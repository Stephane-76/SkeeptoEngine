name: CMake

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  unix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install native deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libzip-dev

      - name: Configure
        run: cmake -B build-unix -DSK_PLATFORM=unix

      - name: Build
        run: cmake --build build-unix --parallel

      - name: Test
        run: cmake --build build-unix --target run-tests

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -A x64 -B build-windows -DSK_PLATFORM=windows -DSK_CONFIGS=Release

      - name: Build
        run: cmake --build build-windows --config Release --parallel

      - name: Dump MSVC / CMake errors
        if: failure()
        shell: pwsh
        run: |
          Write-Host "==== error C / LNK / CMake Error / MSB8066 ===="
          $roots = @(
            "build-windows",
            "Libraries",
            "Libraries_test",
            "SkExcel",
            "SkPressureSp",
            "SkReactSpreadSheet",
            "third-party"
          )
          Get-ChildItem -Path $roots -Recurse -Include *.log,*.txt,BuildLog.htm -ErrorAction SilentlyContinue |
            ForEach-Object {
              $hits = Select-String -Path $_.FullName -Pattern "error C[0-9]+","error LNK","CMake Error","MSB8066","FAILED:" |
                Select-Object -First 30
              if ($hits) {
                Write-Host "==== $($_.FullName) ===="
                $hits | ForEach-Object { $_.Line }
              }
            }

      - name: Test
        run: cmake --build build-windows --config Release --target run-tests
